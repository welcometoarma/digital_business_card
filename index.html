<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Mondello Beach · Digital Card</title>

    <!-- ===== ADD TO HOME SCREEN ===== -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mondello Beach" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        /* ===== REFRESHED PALETTE ===== 
             Deep navy · warm terracotta · soft gold · limestone 
             all colors are explicitly defined – no system dark mode override
        =============================== */
        :root {
            --sea-deep:       #1A3A4A;
            --sea-mid:        #2C5F6E;
            --terracotta:     #D97A3E;
            --terracotta-lt:  #E8A06B;
            --lemon:          #E0B05A;
            --lemon-lt:       #F3DBA6;
            --limestone:      #F6EFE1;
            --paper:          #FFFDF7;
            --ink:            #0B2327;
            --glass-bg:       rgba(255,255,255,0.05);
            --glass-border:   rgba(255,255,255,0.08);
            --brand-whatsapp: #25D366;
            --brand-contact:  #4C8DFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        :focus-visible { outline: 2px solid var(--lemon-lt); outline-offset: 2px; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            font-family: 'Manrope', sans-serif;
            background: #0E1F28;
            background-image: radial-gradient(circle at 50% 50%, rgba(26,58,74,0.95) 0%, #07141C 100%);
            color-scheme: light;
        }

        /* ===== CARD – STANDARD BUSINESS CARD SIZE ===== */
        .card {
            max-width: 360px;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(224,176,90,0.10);
            background: var(--limestone);
            transition: transform 0.2s ease;
            background-color: #F6EFE1;
            color: #0B2327;
        }
        .card:hover { transform: scale(1.01); }

        /* ===== FRONT ===== */
        .card-front {
            padding: 24px 20px 16px;
            background: var(--limestone);
            background-color: #F6EFE1;
            text-align: center;
            position: relative;
            color: #0B2327;
        }
        .card-front .pattern {
            position: absolute;
            inset: 0;
            opacity: 0.25;
            background-image:
                repeating-linear-gradient(45deg, transparent 0 6px, rgba(44,95,110,0.04) 6px 6.5px),
                repeating-linear-gradient(-45deg, transparent 0 6px, rgba(44,95,110,0.04) 6px 6.5px);
            pointer-events: none;
        }
        .front-content { position: relative; z-index: 2; }

        .medallion {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 10px;
            box-shadow: 0 0 0 3px rgba(217,122,62,0.25), 0 0 24px rgba(224,176,90,0.12);
            background: #d4c9b0;
            transition: transform 0.3s ease;
        }
        .medallion:hover { transform: scale(1.04); }
        .medallion img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .badge {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--terracotta);
            background: rgba(217,122,62,0.10);
            padding: 3px 14px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 4px;
        }
        .brand {
            font-family: 'Fraunces', serif;
            font-weight: 700;
            font-size: 24px;
            line-height: 1.0;
            color: var(--sea-mid);
            letter-spacing: 0.01em;
        }
        .brand-script {
            font-family: 'Fraunces', serif;
            font-weight: 500;
            font-style: italic;
            font-size: 17px;
            color: var(--terracotta);
            margin-top: -1px;
        }
        .rule {
            width: 44px;
            height: 2px;
            background: linear-gradient(90deg, var(--terracotta), var(--lemon));
            margin: 8px auto 4px;
            border-radius: 4px;
        }
        .sub {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--sea-mid);
            opacity: 0.7;
        }
        .host-tag {
            margin-top: 10px;
            font-size: 11px;
            font-weight: 600;
            color: var(--sea-mid);
            background: rgba(255,255,255,0.6);
            padding: 5px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.5);
            display: inline-block;
        }
        .host-tag b { color: var(--terracotta); font-weight: 800; }

        /* ===== BACK ===== */
        .card-back {
            padding: 16px 18px 20px;
            background: var(--sea-deep);
            background-color: #1A3A4A;
            background-image: radial-gradient(circle at 20% 20%, rgba(58,139,122,0.06), transparent 60%);
            color: #FFFDF7;
        }

        .back-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 2px;
        }
        .back-eyebrow {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--lemon-lt);
            opacity: 0.7;
        }
        .back-name {
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-weight: 600;
            font-size: 22px;
            color: var(--paper);
            text-shadow: 0 2px 12px rgba(0,0,0,0.2);
        }

        /* ===== BOOK NOW ===== */
        .book-now-wrap { margin-bottom: 10px; }
        .book-now-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--terracotta), var(--lemon));
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 40px;
            text-decoration: none;
            box-shadow: 0 4px 18px rgba(217,122,62,0.3);
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.10);
            width: 100%;
        }
        .book-now-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(217,122,62,0.4);
        }
        .book-now-link svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* ===== ADD CONTACT ===== */
        .add-contact-wrap { margin-bottom: 10px; }
        .add-contact-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(76,141,255,0.12);
            color: var(--paper);
            font-weight: 700;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            border: 1px solid rgba(76,141,255,0.25);
            transition: all 0.2s ease;
            width: 100%;
            font-family: 'Manrope', sans-serif;
        }
        .add-contact-btn:hover {
            background: rgba(76,141,255,0.2);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(76,141,255,0.15);
        }
        .add-contact-btn svg {
            width: 18px;
            height: 18px;
            fill: var(--brand-contact);
            flex-shrink: 0;
        }

        /* ===== CONTACT ROWS ===== */
        .contact-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
            background: var(--glass-bg);
            padding: 7px 14px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            transition: all 0.2s ease;
        }
        .contact-row:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(3px);
            border-color: rgba(224,176,90,0.2);
        }
        .contact-row .icon {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .contact-row .icon svg {
            width: 18px;
            height: 18px;
            stroke-width: 1.8;
            fill: none;
        }
        .icon-whatsapp { background: rgba(37,211,102,0.14); }
        .icon-whatsapp svg { stroke: var(--brand-whatsapp); }
        .icon-maps { background: rgba(234,67,53,0.14); }
        .icon-maps svg { stroke: #EA4335; }
        .icon-instagram { 
            background: linear-gradient(135deg, #F58529, #DD2A7B, #8134AF);
        }
        .icon-instagram svg { stroke: #fff; }

        .contact-text { flex: 1; min-width: 0; }
        .contact-label {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--lemon-lt);
            opacity: 0.6;
            display: block;
            margin-bottom: 1px;
        }
        .contact-value {
            font-size: 13px;
            font-weight: 400;
            color: var(--paper);
            line-height: 1.3;
            word-break: break-word;
        }
        .contact-value a {
            color: var(--paper);
            text-decoration: none;
            transition: color 0.2s;
            font-weight: 500;
        }
        .contact-value a:hover { color: var(--lemon-lt); }

        /* ===== RATING ===== */
        .rating-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 8px 14px;
            margin: 6px 0 10px;
        }
        .rating-score {
            font-family: 'Fraunces', serif;
            font-weight: 700;
            font-size: 26px;
            color: var(--lemon-lt);
            flex-shrink: 0;
            line-height: 1;
        }
        .rating-text {
            font-size: 12px;
            font-weight: 600;
            color: var(--paper);
        }
        .rating-sub {
            font-size: 10px;
            color: var(--paper);
            opacity: 0.6;
        }
        .rating-link {
            color: var(--lemon-lt);
            text-decoration: none;
            font-weight: 600;
            font-size: 11px;
            margin-left: auto;
            flex-shrink: 0;
        }
        .rating-link:hover { text-decoration: underline; }

        /* ===== SHARE ===== */
        .share-section {
            display: flex;
            gap: 6px;
            margin-top: 12px;
        }
        .share-btn {
            font-family: 'Manrope', sans-serif;
            font-weight: 700;
            font-size: 10px;
            padding: 5px 10px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            letter-spacing: 0.02em;
            box-shadow: 0 2px 12px rgba(0,0,0,0.12);
            flex: 1;
            justify-content: center;
            color: #fff;
            transition: all 0.2s ease;
        }
        .share-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            flex-shrink: 0;
        }
        .share-btn-whatsapp { background: #25D366; }
        .share-btn-whatsapp:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(37,211,102,0.3); }
        .share-btn-email { background: var(--terracotta); }
        .share-btn-email:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(217,122,62,0.3); }
        .share-btn-copy { background: #5b6b70; }
        .share-btn-copy:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(91,107,112,0.3); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 400px) {
            .card { max-width: 100%; }
            .medallion { width: 64px; height: 64px; }
            .brand { font-size: 20px; }
            .brand-script { font-size: 15px; }
            .back-name { font-size: 19px; }
            .contact-value { font-size: 12px; }
            .book-now-link { font-size: 13px; padding: 7px 14px; }
            .add-contact-btn { font-size: 12px; padding: 7px 14px; }
        }

        @media print {
            body { background: #fff !important; padding: 4px; }
            .card { box-shadow: 0 0 0 1px #ccc !important; max-width: 100%; }
            .share-section { display: none !important; }
            .book-now-link { background: #D97A3E !important; color: #fff !important; box-shadow: none !important; border: 1px solid #888 !important; }
            .contact-row, .rating-wrap { background: rgba(0,0,0,0.02) !important; border: 1px solid #ddd !important; }
            .contact-value a { color: #1A3A4A !important; }
            .card-back { background: #f5f5f5 !important; }
            .back-name { color: #1A3A4A !important; }
        }

        /* ===== FIX: prevent dark mode color inversion ===== */
        @media (prefers-color-scheme: dark) {
            body {
                background: #0E1F28 !important;
                background-image: radial-gradient(circle at 50% 50%, rgba(26,58,74,0.95) 0%, #07141C 100%) !important;
            }
            .card {
                background: #F6EFE1 !important;
                background-color: #F6EFE1 !important;
                color: #0B2327 !important;
            }
            .card-front {
                background: #F6EFE1 !important;
                background-color: #F6EFE1 !important;
                color: #0B2327 !important;
            }
            .card-back {
                background: #1A3A4A !important;
                background-color: #1A3A4A !important;
                color: #FFFDF7 !important;
            }
            .brand { color: #2C5F6E !important; }
            .brand-script { color: #D97A3E !important; }
            .sub { color: #2C5F6E !important; }
            .host-tag { color: #2C5F6E !important; background: rgba(255,255,255,0.6) !important; }
            .back-name { color: #FFFDF7 !important; }
            .back-eyebrow { color: #F3DBA6 !important; }
            .contact-value a { color: #FFFDF7 !important; }
            .contact-label { color: #F3DBA6 !important; }
            .rating-score { color: #F3DBA6 !important; }
            .rating-text { color: #FFFDF7 !important; }
            .rating-sub { color: #FFFDF7 !important; }
            .rating-link { color: #F3DBA6 !important; }
            .add-contact-btn { color: #FFFDF7 !important; }
            .book-now-link { color: #fff !important; }
            .share-btn { color: #fff !important; }
            .contact-row { background: rgba(255,255,255,0.05) !important; border-color: rgba(255,255,255,0.08) !important; }
            .rating-wrap { background: rgba(255,255,255,0.05) !important; border-color: rgba(255,255,255,0.08) !important; }
            .icon-whatsapp { background: rgba(37,211,102,0.14) !important; }
            .icon-maps { background: rgba(234,67,53,0.14) !important; }
            .icon-instagram { background: linear-gradient(135deg, #F58529, #DD2A7B, #8134AF) !important; }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- ===== FRONT ===== -->
        <div class="card-front">
            <div class="pattern"></div>
            <div class="front-content">
                <div class="medallion">
                    <img src="logo.jpg" alt="Mondello Beach" />
                </div>
               <div class="badge">Mondello · Palermo, Sicilia</div>
                <div class="brand">MONDELLO BEACH</div>
                <div class="brand-script">Vitamin Sea</div>
                <div class="rule"></div>
                <div class="sub">A casa, sul mare</div>
                <div class="host-tag">⭐ Superhost <b>Katie</b></div>
            </div>
        </div>

        <!-- ===== BACK ===== -->
        <div class="card-back">

            <div class="back-header">
                <span class="back-eyebrow">Your Superhost</span>
                <span class="back-name">Katie</span>
            </div>

            <!-- BOOK NOW -->
            <div class="book-now-wrap">
                <a href="https://airbnb.com/h/mondellobeachvitaminsea" target="_blank" class="book-now-link">
                    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    Book now · View on Airbnb
                </a>
            </div>

            <!-- ADD CONTACT - Direct save to contacts -->
            <div class="add-contact-wrap">
                <button class="add-contact-btn" id="addContactBtn">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/><path d="M19 13h-2v3h-3v2h3v3h2v-3h3v-2h-3z"/></svg>
                    Add to Contacts
                </button>
            </div>

            <!-- WHATSAPP -->
            <div class="contact-row">
                <div class="icon icon-whatsapp">
                    <svg viewBox="0 0 32 32"><path d="M16 2C8.3 2 2 8.3 2 16c0 2.8.8 5.5 2.3 7.8L2 30l6.4-2.2C10.6 29.2 13.2 30 16 30c7.7 0 14-6.3 14-14S23.7 2 16 2z"/><path d="M11.7 11.2c.3-.7.6-.7 1-.7.3 0 .6 0 .8.03.3.03.5.13.7.6.2.5.7 1.8.8 1.9.1.2.1.4 0 .6-.1.2-.2.3-.3.5-.2.2-.3.3-.1.6.9 1.5 1.9 2.4 3.4 3.1.2.1.4.1.6-.1.2-.2.6-.7.8-.9.2-.2.4-.2.6-.1.2.1 1.5.7 1.8.9.3.1.5.2.5.4.1.2.1 1-.2 1.7-.4.7-1.6 1.3-2.2 1.4-.6.1-1.2.2-3.9-.9-3.3-1.4-5.4-4.7-5.6-4.9-.2-.3-1.3-1.8-1.3-3.4 0-1.7.9-2.5 1.2-2.8z" fill="var(--brand-whatsapp)" stroke="none"/></svg>
                </div>
                <div class="contact-text">
                    <span class="contact-label">WhatsApp</span>
                    <span class="contact-value"><a href="https://wa.me/393895592579" target="_blank">+39 389 559 2579</a></span>
                </div>
            </div>

            <!-- ADDRESS -->
            <div class="contact-row">
                <div class="icon icon-maps">
                    <svg viewBox="0 0 32 32"><path d="M16 3c-5.2 0-9.4 4.1-9.4 9.3 0 6.8 8.1 15.8 9 16.7.2.3.6.3.8 0 .9-.9 9-9.9 9-16.7C25.4 7.1 21.2 3 16 3z"/><circle cx="16" cy="12.4" r="3.4"/></svg>
                </div>
                <div class="contact-text">
                    <span class="contact-label">Address</span>
                    <span class="contact-value">
                        <a href="https://www.google.com/maps?q=Via+Carbone+73+90151+Palermo+Italia" target="_blank">
                            Via Carbone, 73 · 90151 Palermo
                        </a>
                    </span>
                </div>
            </div>

            <!-- INSTAGRAM -->
            <div class="contact-row">
                <div class="icon icon-instagram">
                    <svg viewBox="0 0 32 32"><rect x="3" y="3" width="26" height="26" rx="7"/><circle cx="16" cy="16" r="6.3"/><circle cx="23.2" cy="8.8" r="1.5" fill="#fff" stroke="none"/></svg>
                </div>
                <div class="contact-text">
                    <span class="contact-label">Instagram</span>
                    <span class="contact-value"><a href="https://instagram.com/mondello_beach_vitamin_sea" target="_blank">@mondello_beach</a></span>
                </div>
            </div>

            <!-- RATING -->
            <div class="rating-wrap">
                <span class="rating-score">5.0</span>
                <div>
                    <div class="rating-text">Guest favorite </div>
                    <div class="rating-sub">reviews · Superhost</div>
                </div>
                <a class="rating-link" href="https://www.airbnb.com/rooms/1081945547038520591" target="_blank">Read reviews ↗</a>
            </div>

            <!-- SHARE -->
            <div class="share-section">
                <button class="share-btn share-btn-whatsapp" id="shareWhatsAppBtn">

                    WhatsApp
                </button>
                <button class="share-btn share-btn-email" id="shareEmailBtn">
                    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    Email
                </button>
                <button class="share-btn share-btn-copy" id="copyLinkBtn">
                    <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    Copy
                </button>
            </div>

        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== Contact data =====
            const contactData = {
                name: 'Katie',
                phone: '+393895592579',
                email: 'katie@mondellobeach.com',
                address: 'Via Carbone, 73, 90151 Palermo, Italy',
                instagram: '@mondello_beach_vitamin_sea',
                url: 'https://airbnb.com/h/mondellobeachvitaminsea'
            };

            // ===== Generate complete vCard =====
            function generateVCard() {
                return [
                    'BEGIN:VCARD',
                    'VERSION:3.0',
                    'FN:' + contactData.name,
                    'N:;' + contactData.name + ';;;',
                    'TEL;TYPE=CELL:' + contactData.phone,
                    'EMAIL:' + contactData.email,
                    'ADR;TYPE=HOME:;;' + contactData.address.replace(/,/g, ';'),
                    'URL;TYPE=BOOKING:' + contactData.url,
                    'NOTE:Instagram: ' + contactData.instagram,
                    'END:VCARD'
                ].join('\n');
            }

            // ===== SAVE CONTACT DIRECTLY - NO DOWNLOAD =====
            function saveContactDirectly() {
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                const isAndroid = /Android/.test(navigator.userAgent);
                
                // For iOS: Use the standard vCard opening method (iOS prompts to add to contacts)
                if (isIOS) {
                    const vcardData = generateVCard();
                    const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    
                    // Open vCard in new window - iOS will show "Add to Contacts" prompt
                    const win = window.open(url, '_blank');
                    if (!win) {
                        // If popup blocked, use link click
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = 'katie_mondello.vcf';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    }
                    
                    // Clean up after delay
                    setTimeout(() => { URL.revokeObjectURL(url); }, 5000);
                    return;
                }
                
                // For Android: Use multiple methods for better compatibility
                if (isAndroid) {
                    // Try Web Share API first (Android Chrome 80+)
                    if (navigator.share) {
                        const vcardText = generateVCard();
                        const blob = new Blob([vcardText], { type: 'text/vcard;charset=utf-8' });
                        const file = new File([blob], 'katie_mondello.vcf', { type: 'text/vcard' });
                        
                        navigator.share({
                            title: 'Save Katie\'s Contact',
                            files: [file]
                        }).catch(err => {
                            // If share fails, fallback to Android intent
                            androidContactIntent();
                        });
                        return;
                    }
                    
                    // Fallback: Android Intent for contact picker
                    androidContactIntent();
                    return;
                }
                
                // Desktop fallback: show vCard for download
                const vcardData = generateVCard();
                const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'katie_mondello.vcf';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => { URL.revokeObjectURL(url); }, 5000);
            }

            // ===== Android Contact Intent =====
            function androidContactIntent() {
                // Method 1: Use intent:// to open contact picker with pre-filled data
                try {
                    // This intent tries to open the contact editor directly
                    const intentUrl = 'intent://contact/#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/contact;end';
                    const win = window.open(intentUrl, '_blank');
                    
                    // If intent doesn't work, try alternative
                    if (!win) {
                        androidVCardFallback();
                    }
                } catch (e) {
                    androidVCardFallback();
                }
            }

            // ===== Android vCard fallback =====
            function androidVCardFallback() {
                // Generate and open vCard - Android will usually handle it
                const vcardData = generateVCard();
                const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                
                // Try to open in new window
                const win = window.open(url, '_blank');
                if (!win) {
                    // If popup blocked, use download link
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'katie_mondello.vcf';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
                
                setTimeout(() => { URL.revokeObjectURL(url); }, 5000);
                
                // Also try to open via data URI as fallback
                setTimeout(() => {
                    try {
                        const dataUri = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(vcardData);
                        window.open(dataUri, '_blank');
                    } catch (e) {
                        // Silent fail
                    }
                }, 1000);
            }

            // ===== Click handler =====
            document.getElementById('addContactBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                
                const btn = this;
                const originalHTML = btn.innerHTML;
                
                // Visual feedback
                btn.innerHTML = '⏳ Opening Contacts...';
                btn.style.opacity = '0.8';
                
                try {
                    saveContactDirectly();
                } catch (error) {
                    console.error('Contact save error:', error);
                    // Try fallback
                    try {
                        const vcard = generateVCard();
                        const dataUri = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(vcard);
                        window.open(dataUri, '_blank');
                    } catch (e2) {
                        alert('Please copy the contact information manually.');
                    }
                }
                
                // Reset button after 3 seconds
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.style.opacity = '1';
                }, 3000);
            });

            // ===== SHARE =====
            const pageUrl = 'https://welcometoarma.github.io/digital_business_card/';
            
            // Plain text without emojis for better Android compatibility
            const shareText = 'Mondello Beach · Vitamin Sea – book your stay in Palermo!';

            document.getElementById('shareWhatsAppBtn').addEventListener('click', function() {
                // WhatsApp works fine with emojis, but we keep it clean
                const url = 'https://wa.me/?text=' + encodeURIComponent(shareText + ' ' + pageUrl);
                window.open(url, '_blank');
            });

            // ===== FIXED EMAIL SHARE FOR ANDROID =====
            document.getElementById('shareEmailBtn').addEventListener('click', function() {
                // Use plain ASCII characters for subject and body - Android compatible
                const subject = 'Mondello Beach  Vitamin Sea';
                // Clean body text without emojis or special characters
                const body = 'Mondello Beach - Vitamin Sea\n\nBook your stay in Palermo!\n\n' + pageUrl;
                
                // Use mailto: with properly encoded parameters
                const mailtoLink = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
                
                // For Android, try to open with a small delay to ensure it works
                if (/Android/.test(navigator.userAgent)) {
                    // Android sometimes needs a slightly different approach
                    try {
                        window.location.href = mailtoLink;
                    } catch (e) {
                        // Fallback: open in new window
                        window.open(mailtoLink, '_blank');
                    }
                } else {
                    // iOS and desktop
                    window.location.href = mailtoLink;
                }
            });

            document.getElementById('copyLinkBtn').addEventListener('click', function() {
                const btn = this;
                const origText = btn.innerHTML;
                
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(pageUrl).then(() => {
                        btn.innerHTML = '✅ Copied!';
                        setTimeout(() => { btn.innerHTML = origText; }, 2000);
                    }).catch(() => {
                        fallbackCopy(pageUrl, btn, origText);
                    });
                } else {
                    fallbackCopy(pageUrl, btn, origText);
                }
            });

            function fallbackCopy(text, btn, origText) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                ta.style.top = '-9999px';
                ta.style.width = '1px';
                ta.style.height = '1px';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try {
                    const success = document.execCommand('copy');
                    if (success) {
                        btn.innerHTML = '✅ Copied!';
                        setTimeout(() => { btn.innerHTML = origText; }, 2000);
                    } else {
                        if (navigator.share) {
                            navigator.share({
                                title: 'Mondello Beach',
                                text: shareText,
                                url: pageUrl
                            }).catch(() => {});
                        } else {
                            alert('Copy failed. Please copy manually:\n' + text);
                        }
                    }
                } catch (e) {
                    if (navigator.share) {
                        navigator.share({
                            title: 'Mondello Beach',
                            text: shareText,
                            url: pageUrl
                        }).catch(() => {
                            alert('Copy failed. Please copy manually:\n' + text);
                        });
                    } else {
                        alert('Copy failed. Please copy manually:\n' + text);
                    }
                }
                document.body.removeChild(ta);
            }

        })();
    </script>

</body>
